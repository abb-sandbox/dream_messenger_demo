name: dream_messenger_demo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  get_it: ^9.2.0
  equatable: ^3.0.0
  flutter_svg: ^2.2.3
  app_links: ^7.0.0
  dartz: ^0.10.1
  dio: ^5.9.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_database: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  image_path_android: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
#  assets:
#    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
        - asset: assets/fonts/Roboto-Medium.ttf